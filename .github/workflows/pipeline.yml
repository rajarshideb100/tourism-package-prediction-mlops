name: Tourism Project Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register and validate dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Prepare data
        run: python tourism_project/model_building/prep.py
      - name: Upload train-test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download train-test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Train and evaluate model
        run: python tourism_project/model_building/train.py
      - name: Commit trained model and metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tourism_project/deployment/best_tourism_package_model.joblib tourism_project/deployment/model_metrics.json tourism_project/deployment/best_model_params.json
          git commit -m 'Update trained tourism model [skip ci]' || echo 'No model changes to commit'
          git push
